<!doctype html>
<html>
    <head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Login — BookMyShow</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
<body>
    <div id="navbar"></div>
    <main class="auth-wrap">
        <div class="auth-card">
            <span class="kicker">WELCOME BACK</span>
            <h1>Login</h1>
            <p>Sign in to access your bookings.</p>
            <form id="form">
                <div class="form-group">
                    <label>Email</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <button class="btn primary">Login</button>
            </form>
            <p style="text-align:center">Don't have an account? <a href="signup.html" style="color:#ff6a80">Sign up</a></p>
        </div></main><div id="toast"></div>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
form.onsubmit = async e => {
    e.preventDefault();

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    try {
        const u = await tryPost(ENDPOINTS.login, {
            email: emailInput.value.trim(),
            password: passwordInput.value
        });

        saveUser(u);

        toast("Login successful");

        setTimeout(() => {
            location.href = "../index.html";
        }, 600);

    } catch (e) {
        toast(e.message || "Login failed");
    }
};
</script></body></html>
