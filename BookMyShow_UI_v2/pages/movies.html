<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movies — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="movies"><div id="navbar"></div><header class="page-top"><div class="container"><span class="kicker">DISCOVER</span><h1>Movies</h1><p>Search by movie name — or narrow it down by genre and language.</p></div></header>
<main class="section"><div class="container"><div class="toolbar"><input id="q" class="field search" placeholder="Search movie by name..."><select id="g" class="field"><option value="">All genres</option><option>Action</option><option>Comedy</option><option>Sci-Fi</option><option>Sports</option><option>Drama</option></select><select id="l" class="field"><option value="">All languages</option><option>Hindi</option><option>English</option><option>Kannada</option></select><button id="go" class="btn primary">Search</button></div><div id="grid" class="movie-grid"></div></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
const initial=new URLSearchParams(location.search).get("search")||"";q.value=initial;
async function run(){grid.innerHTML='<div class="loading">Searching...</div>';try{let list=initial||q.value.trim()?await searchMoviesByName(q.value.trim()):await getMovies();const genre=g.value.toLowerCase(),lang=l.value.toLowerCase();if(genre)list=list.filter(m=>(m.genre||"").toLowerCase()===genre);if(lang)list=list.filter(m=>(m.language||"").toLowerCase()===lang);grid.innerHTML=list.length?list.map(movieCard).join(""):'<div class="empty">No movie matches your search.</div>'}catch(e){grid.innerHTML='<div class="empty">Could not load movies. Check your Spring Boot server and CORS configuration.</div>'}}
go.onclick=run;q.addEventListener("keydown",e=>{if(e.key==="Enter")run()});g.onchange=run;l.onchange=run;run();
</script></body></html>
