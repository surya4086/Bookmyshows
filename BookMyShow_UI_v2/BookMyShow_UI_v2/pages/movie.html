<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="movies"><div id="navbar"></div><main class="section"><div class="container" id="detail"><div class="loading">Loading movie...</div></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get("id");if(!id)return;try{const m=await getMovie(id);document.title=`${m.title} — BookMyShow`;detail.innerHTML=`<div class="detail-layout"><div class="detail-poster"><img src="${esc(m.posterUrl||"")}" alt="${esc(m.title)}"></div><div class="detail"><span class="kicker">${esc(m.genre||"MOVIE")}</span><h1>${esc(m.title)}</h1><div class="pills"><span class="pill">★ ${m.rating??"—"}</span><span class="pill">${esc(m.language||"")}</span><span class="pill">${m.durationMinutes??"—"} min</span><span class="pill">${esc(m.releaseDate||"")}</span></div><p class="detail-description">${esc(m.description||"No description available.")}</p><a class="btn primary" href="shows.html?movieId=${m.id}">Find shows & book</a></div></div>`}catch(e){detail.innerHTML='<div class="empty">Movie not found.</div>'}})();
</script></body></html>
