<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="bookings"><div id="navbar"></div><header class="page-top"><div class="container"><span class="kicker">YOUR TICKETS</span><h1>My Bookings</h1><p>Track your movie tickets and booking status.</p></div></header><main class="section"><div class="container" id="list"></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
(async()=>{const u=user();if(!u){list.innerHTML='<div class="empty">Please <a style="color:#ff6a80" href="login.html">login</a> to view bookings.</div>';return}try{const a=await getUserBookings(u.id);list.innerHTML=a.map(b=>`<article class="booking-card"><div style="display:flex;justify-content:space-between;gap:12px"><div><h3>${esc(b.show?.movie?.title||"Movie")}</h3><p>${esc(b.show?.showDate||"")} • ${esc(b.show?.startTime||"")} • ${esc(b.show?.screen?.name||"")}</p></div><span class="status ${(b.status||"").toLowerCase()}">${esc(b.status)}</span></div><p>Seats: ${(b.seats||[]).map(s=>esc(s.seatNumber)).join(", ")}</p><b>Total: ₹${b.totalprice??b.totalPrice??"—"}</b>${b.status==="CONFIRMED"?`<button class="btn outline" style="float:right" onclick="cancel(${b.id})">Cancel</button>`:""}</article>`).join("")||'<div class="empty">No bookings yet.</div>'}catch(e){list.innerHTML='<div class="empty">Could not load bookings.</div>'}})();
async function cancel(id){try{await cancelBooking(id);toast("Booking cancelled");setTimeout(()=>location.reload(),600)}catch(e){toast(e.message||"Cancellation failed")}}
</script></body></html>
