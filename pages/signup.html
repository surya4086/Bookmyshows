<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div id="navbar"></div><main class="auth-wrap"><div class="auth-card"><span class="kicker">CREATE ACCOUNT</span><h1>Join BookMyShow</h1><p>Save your account and make booking faster.</p><form id="form"><div class="form-group"><label>Name</label><input id="name" required></div><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" required></div><div class="form-group"><label>Phone</label><input id="phone" required></div><button class="btn primary">Create account</button></form></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
form.onsubmit=async e=>{e.preventDefault();try{const u=await tryPost(ENDPOINTS.register,{name:name.value,email:email.value,password:password.value,phone:phone.value});saveUser(u);toast("Account created");setTimeout(()=>location.href="../index.html",600)}catch(e){toast(e.message||"Signup failed")}}
</script></body></html>
