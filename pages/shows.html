<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shows — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="movies"><div id="navbar"></div><header class="page-top"><div class="container"><span class="kicker">SHOWTIMES</span><h1>Choose a show</h1><p>Select a time and continue to seat selection.</p></div></header><main class="section"><div class="container"><div id="shows" class="theater-grid"></div></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get("movieId");try{let list=await getShowsByMovie(id);shows.innerHTML=list.map(s=>`<article class="theater-card"><h3>${esc(s.movie?.title||"Show")}</h3><p>🏢 ${esc(s.screen?.theater?.name||s.screen?.name||"Screen")}</p><p>📅 ${esc(s.showDate||"")} &nbsp; • &nbsp; ${esc(s.startTime||"")} - ${esc(s.endTime||"")}</p><p>₹${s.ticketPrice??"—"} per seat</p><a class="btn primary" href="booking.html?showId=${s.id}">Select seats</a></article>`).join("")||'<div class="empty">No shows found for this movie.</div>'}catch(e){shows.innerHTML='<div class="empty">Could not load shows. If your ShowController uses another URL, share it and I will wire it exactly.</div>'}})();
</script></body></html>
