<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Seats — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="bookings"><div id="navbar"></div><main class="section"><div class="container"><div class="booking-layout"><section class="booking-panel"><div id="showInfo"></div><div class="screen">SCREEN</div><div id="seatGrid" class="seat-grid"></div><div class="legend"><span><i></i>Available</span><span><i class="selected-i"></i>Selected</span><span><i></i>Booked</span></div></section><aside class="summary"><h3>Booking summary</h3><div id="summary"><p style="color:#929bb3">Choose your seats.</p></div></aside></div></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
let show,selected=[];
(async()=>{const id=new URLSearchParams(location.search).get("showId");try{show=await getShow(id);showInfo.innerHTML=`<h2 style="margin:0 0 7px">${esc(show.movie?.title||"Movie")}</h2><p style="color:#929bb3;font-size:12px">${esc(show.screen?.name||"Screen")} • ${esc(show.showDate||"")} • ${esc(show.startTime||"")}</p>`;const seats=await getAvailableSeats(id);seatGrid.innerHTML=seats.map(s=>`<button class="seat" data-id="${s.id}">${esc(s.seatNumber)}</button>`).join("");seatGrid.querySelectorAll(".seat").forEach(b=>b.onclick=()=>{const id=+b.dataset.id;if(b.classList.toggle("selected"))selected.push(id);else selected=selected.filter(x=>x!==id);render()});render()}catch(e){seatGrid.innerHTML='<div class="empty">Seats could not be loaded. Check your booking/show controller endpoint.</div>'}})();
function render(){const total=selected.length*(show?.ticketPrice||0);summary.innerHTML=`<div class="summary-row"><span>Selected seats</span><span>${selected.length}</span></div><div class="summary-row"><span>Price / seat</span><span>₹${show?.ticketPrice||0}</span></div><div class="summary-total"><span>Total</span><span>₹${total}</span></div><button class="btn primary" style="width:100%" onclick="book()">Confirm booking</button>`}
async function book(){const u=user();if(!u){toast("Please login before booking.");setTimeout(()=>location.href="login.html",700);return}if(!selected.length){toast("Please select at least one seat.");return}try{await createBooking({userId:u.id,showId:show.id,seatIds:selected});toast("Booking confirmed 🎉");setTimeout(()=>location.href="bookings.html",800)}catch(e){toast(e.message||"Booking failed")}}
</script></body></html>
