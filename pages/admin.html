<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="admin"><div id="navbar"></div><header class="page-top"><div class="container"><span class="kicker">CONTROL CENTER</span><h1>Admin Dashboard</h1><p>Overview of your movie booking system.</p></div></header><main class="section"><div class="container"><div id="stats" class="admin-grid"></div><div style="height:35px"></div><div class="why-grid"><div><span class="big-icon">🎬</span><h3>Movies</h3><p>Manage movie catalogue, ratings, languages and poster URLs.</p></div><div><span class="big-icon">🏢</span><h3>Theatres & screens</h3><p>Manage cinemas, screens and seat layouts.</p></div><div><span class="big-icon">🕒</span><h3>Shows</h3><p>Create show dates, timings and ticket prices.</p></div></div></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
(async()=>{try{const [m,t,s,u]=await Promise.all([getMovies(),getTheaters(),tryGet(ENDPOINTS.shows).then(normalizeList),tryGet(ENDPOINTS.users).then(normalizeList)]);stats.innerHTML=[[m.length,"Movies"],[t.length,"Theatres"],[s.length,"Shows"],[u.length,"Users"]].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}catch(e){stats.innerHTML='<div class="empty">Some admin statistics could not be loaded.</div>'}})();
</script></body></html>
