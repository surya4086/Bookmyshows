<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theatres — BookMyShow</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="theaters"><div id="navbar"></div><header class="page-top"><div class="container"><span class="kicker">LOCATIONS</span><h1>Theatres</h1><p>Explore cinemas and their screens.</p></div></header><main class="section"><div class="container"><div id="theaters" class="theater-grid"></div></div></main><div id="toast"></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script><script>
(async()=>{try{let list=await getTheaters();const cityId=new URLSearchParams(location.search).get("cityId");if(cityId)list=list.filter(t=>String(t.city?.id??t.cityId)===String(cityId));theaters.innerHTML=list.map(t=>`<article class="theater-card"><h3>${esc(t.name)}</h3><p>📍 ${esc(t.address||"")}</p><p>${esc(t.city?.name||"")} ${t.city?.state?"• "+esc(t.city.state):""}</p><a class="btn ghost" href="shows.html?theaterId=${t.id}">View shows</a></article>`).join("")||'<div class="empty">No theatres found.</div>'}catch(e){theaters.innerHTML='<div class="empty">Could not load theatres.</div>'}})();
</script></body></html>
